<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <!-- Application Header -->
    <h1>Sudoku Game</h1>
    <!-- Game Controls -->
    <div class="controls">
      <label for="difficulty-select">Difficulty:</label>
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <label for="player-name">Player:</label>
      <input id="player-name" type="text" maxlength="20" placeholder="Player name" value="Player">
      <span id="timer" aria-live="polite">Time: 00:00</span>
      <button id="new-game">New Game</button>
      <button id="check-solution">Check Solution</button>
      <button id="hint-button">Hint</button>
      <button id="theme-toggle" type="button" aria-label="Toggle dark and light mode">Dark mode</button>
      <span id="message" aria-live="polite"></span>
    </div>
    <!-- Sudoku Board -->
    <div id="sudoku-board"></div>
    <!-- Leaderboard -->
    <section id="leaderboard-section" aria-label="Top 10 leaderboard">
      <h2>Top 10 Leaderboard</h2>
      <div class="leaderboard-table-wrapper">
        <table id="leaderboard-table" class="leaderboard-table">
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Name</th>
              <th scope="col">Time</th>
              <th scope="col">Level</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <!-- JavaScript -->
  <script src="/static/main.js" defer></script>
</body>
</html>
